name: No network

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ARCHS=arm64 ./build.sh "$RUNNER_TEMP/apps"
      - name: Verify the app makes no outbound connections
        run: ./verify-no-network.sh "$RUNNER_TEMP/apps/Steam Shelf.app"
